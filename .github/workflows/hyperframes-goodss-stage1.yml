name: hyperframes-goodss Stage 1 + 1.1 + 2A smoke

on:
  push:
    paths:
      - 'hyperframes-goodss/**'
      - '.github/workflows/hyperframes-goodss-stage1.yml'
  workflow_dispatch:

jobs:
  stage1-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hyperframes-goodss

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hyperframes-goodss/package.json

      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Verify tools
        run: |
          node --version
          npm --version
          ffmpeg -version | head -1
          ffprobe -version | head -1
          which google-chrome || which chromium || which chromium-browser || true

      - name: Install dependencies
        run: npm install

      - name: Prepare GSAP vendor runtime
        shell: bash
        run: |
          mkdir -p vendor
          cp node_modules/gsap/dist/gsap.min.js vendor/gsap.min.js

      - name: Generate CI master-sheet fixture
        shell: bash
        run: |
          ffmpeg -y -v error \
            -f lavfi -i "color=c=0xf5f3ef:s=1536x1024:d=1" \
            -vf "drawbox=x=0:y=0:w=1536:h=84:color=0x111111:t=fill,drawbox=x=0:y=951:w=1536:h=73:color=0x111111:t=fill,drawgrid=w=256:h=438:t=5:c=0x888888@0.8" \
            -frames:v 1 ci-master-sheet.png
          ffprobe -v error -show_entries stream=width,height -of default=noprint_wrappers=1 ci-master-sheet.png

      - name: Run Stage 1 default acceptance path
        shell: pwsh
        env:
          HF_CAPTURE_FPS: '5'
          HF_CAPTURE_SCALE: '0.3'
        run: ./run-stage1.ps1 -MasterSheet ./ci-master-sheet.png -Quality draft -Renderer fallback -SkipSetup -NoOpen

      - name: Run Stage 1.1 preset render smoke
        shell: pwsh
        env:
          HF_CAPTURE_FPS: '4'
          HF_CAPTURE_SCALE: '0.28'
        run: ./scripts/smoke-presets.ps1

      - name: Run Stage 2A validation regression tests
        run: npm run stage2a:test

      - name: Run Stage 2A character project from project.json
        shell: pwsh
        env:
          HF_CAPTURE_FPS: '4'
          HF_CAPTURE_SCALE: '0.28'
        run: ./run-stage2a.ps1 -ProjectFile ./project.json -Quality draft -Renderer fallback -SkipSetup -NoOpen

      - name: Run Stage 2A non-character image-video sample
        shell: pwsh
        env:
          HF_CAPTURE_FPS: '4'
          HF_CAPTURE_SCALE: '0.32'
        run: ./run-stage2a.ps1 -ProjectFile ./samples/non-character/project.json -Quality draft -Renderer fallback -SkipSetup -NoOpen

      - name: Print QA reports
        if: always()
        shell: bash
        run: |
          echo '--- Stage 1 Long QA ---'
          cat renders/qa-long.json 2>/dev/null || true
          echo '--- Stage 1 Short QA ---'
          cat renders/qa-short.json 2>/dev/null || true
          echo '--- Stage 1.1 preset QA ---'
          for f in renders/preset-*-qa.json; do echo "### $f"; cat "$f"; done 2>/dev/null || true
          echo '--- Stage 2A QA ---'
          find renders/stage2a -name '*-qa.json' -type f -print -exec cat {} \; 2>/dev/null || true
          echo '--- Stage 2A build reports ---'
          find renders/stage2a -name 'build-report.json' -type f -print -exec cat {} \; 2>/dev/null || true

      - name: Upload Stage 1 + 1.1 + 2A smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-goodss-stage2a-smoke
          if-no-files-found: warn
          path: |
            hyperframes-goodss/renders/style-showcase-long-fixed.mp4
            hyperframes-goodss/renders/style-showcase-short-fixed.mp4
            hyperframes-goodss/renders/qa-long.json
            hyperframes-goodss/renders/qa-short.json
            hyperframes-goodss/renders/preset-*-short-fixed.mp4
            hyperframes-goodss/renders/preset-*-qa.json
            hyperframes-goodss/renders/stage2a/**/*
            hyperframes-goodss/generated/stage2a/**/manifest.json
            hyperframes-goodss/project.json
            hyperframes-goodss/samples/non-character/project.json
            hyperframes-goodss/config/project.schema.v2.json
